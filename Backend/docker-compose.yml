# BillFlow stack — secrets only in .env (gitignored). Never commit real passwords.
#
# Postgres + Redis:     docker compose up -d
# + pgAdmin:            docker compose --profile tools up -d
# + API services:       docker compose --profile apps up -d --build
# Everything:           docker compose --profile tools --profile apps up -d --build

name: billflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: billflow-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - billflow-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: billflow-redis
    restart: unless-stopped
    env_file: .env
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - billflow-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: billflow-pgadmin
    profiles: [tools]
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - billflow-internal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/BillFlow.AuthService/BillFlow.AuthService.csproj
        ASSEMBLY_NAME: BillFlow.AuthService
    container_name: billflow-auth
    profiles: [apps]
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-BillFlow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-BillFlow.Api}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?Set REFRESH_TOKEN_PEPPER in .env}
      # Dev default true; set APPLY_MIGRATIONS=false in production .env
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-true}
    networks:
      - billflow-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-5237}:8080"

  management-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: Services/BillFlow.ManagementService/BillFlow.ManagementService.csproj
        ASSEMBLY_NAME: BillFlow.ManagementService
    container_name: billflow-management
    profiles: [apps]
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-BillFlow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-BillFlow.Api}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Set SUPERADMIN_EMAIL in .env}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Set SUPERADMIN_PASSWORD in .env}
      SUPERADMIN_FULL_NAME: ${SUPERADMIN_FULL_NAME:-BillFlow Super Admin}
    networks:
      - billflow-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MANAGEMENT_SERVICE_PORT:-5177}:8080"

networks:
  billflow-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
