# Production-oriented compose override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from dev:
# - PostgreSQL and Redis are not exposed on the host (internal network only)
# - ASPNETCORE_ENVIRONMENT defaults to Production

services:
  postgres:
    ports: []

  redis:
    ports: []

  auth-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-false}
      ALLOW_DEV_RESET_PASSWORD: "false"

  management-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env for production}

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:?Set VITE_AUTH_API_URL for production frontend build}
        VITE_MANAGEMENT_API_URL: ${VITE_MANAGEMENT_API_URL:?Set VITE_MANAGEMENT_API_URL for production frontend build}
    container_name: billflow-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      management-service:
        condition: service_healthy
    networks:
      - billflow-internal
