name: Backend CI

on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: Backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: |
          # Run assemblies sequentially — both fixtures mutate process-wide DB_*/REDIS_* env.
          dotnet test Tests/BillFlow.AuthService.Tests/BillFlow.AuthService.Tests.csproj --no-build -c Release --verbosity normal
          dotnet test Tests/BillFlow.ManagementService.Tests/BillFlow.ManagementService.Tests.csproj --no-build -c Release --verbosity normal
